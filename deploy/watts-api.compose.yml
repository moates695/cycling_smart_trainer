# The WATTS API, as a fragment to merge into the backend-prod stack at
# /root/gym_junkie_server/docker-compose.yml.
#
# Deliberately no `ports:` — api-prod already owns host port 8000, and nginx
# reaches this over the docker network.
#
# The database is the PostgreSQL 16 installed on the droplet itself, not a
# container: one server for every app on the box, one backup and one upgrade to
# keep track of, and it mirrors local dev, which is the Postgres installed on
# the developer's machine. The container reaches it at host.docker.internal,
# mapped to the bridge gateway below — pg_hba.conf already admits the docker
# subnets (172.16.0.0/12), and the host server is not reachable off the droplet
# except from the addresses that file names.
services:
  watts-api:
    build:
      # Relative to this file, which deploy-api.sh installs at $REMOTE_DIR/
      # docker-compose.yml with the source rsynced alongside it at
      # $REMOTE_DIR/server. ../server would resolve to /root/server.
      context: ./server
    image: watts-api:latest
    container_name: watts-api
    restart: unless-stopped
    env_file:
      - /root/gym_junkie_server/app/envs/watts.env
    environment:
      WATTS_ENV: production
      WATTS_DATABASE_URL: postgresql+psycopg://watts:${WATTS_DB_PASSWORD}@host.docker.internal:5432/watts
      # The PWA is same origin behind nginx, so no CORS and no preflight.
      WATTS_CORS_ORIGINS: ""
    # host.docker.internal is not defined on Linux unless it is asked for. The
    # name rather than 172.18.0.1 because the bridge is renumbered if the
    # backend-prod network is ever recreated.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend-prod_api-network

networks:
  backend-prod_api-network:
    external: true
