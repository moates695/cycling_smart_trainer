
server {
	listen 80;
	server_name watts.moates.com.au;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	server_name watts.moates.com.au;

	ssl_certificate /etc/nginx/ssl/cloudflare-cert.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-key.pem;

	root /var/www/watts;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location ~* \.(js|css|png|svg|webmanifest)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
