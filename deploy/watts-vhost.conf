# >>> watts vhost (managed by deploy/setup-droplet.sh — do not edit on the droplet)
server {
	listen 80;
	server_name watts.moates.com.au;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	server_name watts.moates.com.au;

	ssl_certificate /etc/nginx/ssl/cloudflare-cert.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-key.pem;

	root /var/www/watts;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location ~* \.(js|css|png|svg|webmanifest)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}

	# The accounts and sync API. Same origin with the PWA on purpose: the
	# session cookie is first party, and no CORS preflight is involved.
	#
	# proxy_pass goes through a variable so the upstream is resolved per
	# request rather than at config load. Naming the container directly would
	# make nginx refuse to start whenever watts-api is down, taking every other
	# site on this proxy with it; this way only /api/ returns 502.
	#
	# NGINX_ENVSUBST_FILTER is '^API_PORT$', so $watts_api, $request_uri and
	# the rest below survive envsubst untouched.
	# ^~ so this beats the regex location for static assets above; a plain
	# prefix location would lose to it on any API path ending in .js or .css.
	location ^~ /api/ {
		resolver 127.0.0.11 valid=10s;
		set $watts_api http://watts-api:8010;

		proxy_pass $watts_api$request_uri;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		# Cloudflare sits in front, so prefer the origin client address it
		# passes through. The API rate limits per client, and getting this
		# wrong would bucket every rider under one address.
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;

		# Auth responses set cookies and sync responses are per user. Nothing
		# here is ever cacheable.
		add_header Cache-Control "no-store" always;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
# <<< watts vhost
